  <title>Drama-Free Prompt Engine & Optimizer</title>
  <script>
    // Intercept and suppress benign sandbox-specific WebSocket/HMR errors
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
      if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('closed without opened') !== -1) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    });

    window.addEventListener('error', function(event) {
      var msg = event.message || '';
      if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    });
  </script>
